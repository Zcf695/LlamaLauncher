name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 安装 Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d

    - name: 编译 llama.cpp for Android
      run: |
        git clone https://github.com/ggerganov/llama.cpp.git --depth 1
        cd llama.cpp
        mkdir build-android && cd build-android
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLAMA_CURL=OFF \
          -DLLAMA_BUILD_SERVER=ON
        cmake --build . --config Release -j$(nproc)
        # 重命名为 .so（Android 要求）
        mkdir -p ../../app/src/main/jniLibs/arm64-v8a
        cp bin/llama-server ../../app/src/main/jniLibs/arm64-v8a/libllama_server.so
        cd ../..
        echo "llama-server 编译完成"
        ls -lh app/src/main/jniLibs/arm64-v8a/

    - name: 安装 Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 生成 Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: 编译 APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: llama-launcher-apk
        path: app/build/outputs/apk/debug/app-debug.apk
